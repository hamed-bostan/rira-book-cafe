name: rira-test

# Throwaway database for the integration and E2E tests — never the dev database.
#   postgresql://rira:testpassword@localhost:5546/rira_test
# Its data lives in memory (tmpfs), so `down` (or a reboot) wipes it; the test runs
# migrate and seed it themselves before they start.
#
# Usage:
#   npm run db:test:up        # start
#   npm run db:test:down      # stop and discard

services:
  db:
    image: postgres:17-alpine
    container_name: rira-test-db
    environment:
      # Throwaway test credentials — must match TEST_DATABASE_URL (see `.env.test`).
      POSTGRES_USER: rira
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: rira_test
    ports:
      # Loopback only; 5546 sits next to the dev database's 5545.
      - "127.0.0.1:5546:5432"
    tmpfs:
      - /var/lib/postgresql/data
    # Durability is pointless for a database that's thrown away — trade it for speed.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rira -d rira_test"]
      interval: 2s
      timeout: 5s
      retries: 15
