name: CodeQL

# Static security analysis (taint tracking for XSS, injection, SSRF, path
# traversal, …) of the app code and of the workflows themselves. Separate from
# ci.yml so the two evolve independently.
#
# The repo is private without GitHub Advanced Security, so Code scanning (the
# Security tab) is unavailable and SARIF uploads are rejected. Instead the
# results stay in the run: listed in the job summary, kept as an artifact, and
# any finding fails the job so it can't go unnoticed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new CodeQL queries catch issues in code that hasn't changed.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4

      # Interpreted languages need no build: CodeQL extracts the sources directly.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # js/log-injection: every log line goes through PinoLogger, which writes
          # structured JSON (fields escaped) and flattens line breaks in messages,
          # so a user value can't forge a log line. The rule can only ever flag that
          # one sink, and still does after the fix — a permanent false positive.
          config: |
            query-filters:
              - exclude:
                  id: js/log-injection

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: never
          upload-database: false
          output: sarif-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: ignore

      - name: Report findings
        run: |
          findings=$(jq -r '.runs[].results[]
            | "| \(.level // "warning") | `\(.ruleId)` | `\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // 0)` | \(.message.text | gsub("\n"; " ")) |"' \
            sarif-results/*.sarif)
          count=$(printf '%s' "$findings" | grep -c '^|' || true)
          {
            echo "## CodeQL (${{ matrix.language }}): $count finding(s)"
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Level | Rule | Location | Message |"
              echo "| --- | --- | --- | --- |"
              echo "$findings"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::error::CodeQL reported $count finding(s); see the job summary or the codeql-${{ matrix.language }} artifact."
            exit 1
          fi
