# Plain HTTP until a domain points at the VPS. Once it does:
#   1. issue a certificate with certbot (webroot ./certbot/www, config ./certbot/conf),
#   2. replace this file with the HTTPS pair in rira-https.conf.example (set the domain),
#   3. `docker compose restart nginx`.
server {
    listen 80 default_server;
    server_name _;

    # Image uploads are capped at 5 MB by the app; leave headroom for multipart overhead.
    client_max_body_size 6m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
    }
}
