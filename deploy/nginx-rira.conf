# Host nginx site for Rira → /etc/nginx/sites-available/rira (symlinked into
# sites-enabled). Set server_name to the domain (or the server IP until there is
# one), then `nginx -t && systemctl reload nginx`. For HTTPS once a domain points
# here: `certbot --nginx -d your-domain` rewrites this file in place.
server {
    listen 80;
    listen [::]:80;
    server_name RIRA_SERVER_NAME;

    # Image uploads are capped at 5 MB by the app; leave headroom for multipart overhead.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # $http_host keeps a non-default port (e.g. :8080): Next.js rejects Server
        # Actions whose Origin and forwarded host disagree.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Correlation id: nginx generates one per request ($request_id); the app tags
        # its log lines and error-tracker events with it, and the response echoes it.
        proxy_set_header X-Request-Id      $request_id;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        add_header X-Request-Id $request_id always;
    }
}
