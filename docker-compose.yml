name: rira

# Production stack on the VPS (lives in /opt/rira next to `.env.production`).
# CI publishes ghcr.io/hamed-bostan/rira-book-cafe:production; rira-update.timer
# pulls it and recreates `app` when the image changed. The host's own nginx
# (shared with other sites on this VPS) proxies to 127.0.0.1:3100 — see
# deploy/nginx-rira.conf. Port 3000 on the host is taken by another app.

services:
  app:
    image: ghcr.io/hamed-bostan/rira-book-cafe:production
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Uploaded images live in the `uploads` volume (served from /uploads).
      UPLOADS_DIR: /app/storage/uploads
      # Server Components call the BFF in-container instead of looping out through nginx.
      API_BASE_URL: http://127.0.0.1:3000/api
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only: reachable through the host nginx, never directly from the internet.
      - "127.0.0.1:3100:3000"
    volumes:
      - uploads:/app/storage/uploads
    networks:
      - web
    # The image's own HEALTHCHECK (GET /api/health: server up + database reachable)
    # applies; see deploy/README.md for pointing an uptime monitor at the same URL.

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rira -d rira"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  web:
    driver: bridge

volumes:
  pgdata:
  uploads:
