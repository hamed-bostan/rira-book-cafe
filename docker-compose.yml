name: rira

# Production stack on the VPS (lives in /opt/rira next to `.env.production`).
# CI publishes ghcr.io/hamed-bostan/rira-book-cafe:production; rira-update.timer
# pulls it and recreates `app` when the image changed.

services:
  app:
    image: ghcr.io/hamed-bostan/rira-book-cafe:production
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Uploaded images live in the `uploads` volume (served from /uploads).
      UPLOADS_DIR: /app/storage/uploads
      # Server Components call the BFF in-container instead of looping out through nginx.
      API_BASE_URL: http://127.0.0.1:3000/api
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - uploads:/app/storage/uploads
    networks:
      - web
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rira -d rira"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  pgdata:
  uploads:
